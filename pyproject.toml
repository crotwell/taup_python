[build-system]
requires = ["uv_build>=0.12.20,<0.13"]
build-backend = "uv_build"


[project]
name = "taup"
version = "3.2.2a"
authors = [
  {name="Philip Crotwell", email = "crotwell@seis.sc.edu"}
]
description = "The TauP Toolkit, via Python"
readme = "README.md"
keywords = ["seismology", "traveltime"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)",
    "Operating System :: OS Independent"
]
requires-python = ">=3.11"
dependencies = [
    'requests'
]

[project.urls]
Homepage = "https://github.com/crotwell/taup_python"
Repository = "https://github.com/crotwell/taup_python"
Issues = "https://github.com/crotwell/taup_python/issues"


[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]

[tool.hatch.envs.test]
  dependencies = [
    "pytest"
  ]
